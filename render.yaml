# Render Blueprint — creates the Sit.Stay.Play web service.
# In Render: New -> Blueprint -> connect this repo. Then add the environment
# variables listed below in the Render dashboard (never commit secrets).
services:
  - type: web
    # ⚠️ NOT renamed with the rest of the 2026-09-05 Sit.Stay.Play rename, and
    # corrected 2026-09-06: this said `petpro-connect`, which is not the live
    # service. Verified against Render: petpro-app.onrender.com/health answers
    # 200, petpro-connect.onrender.com/health answers 404. Applying the old
    # value would have created a second, empty service while the running API
    # sat untouched — a deploy that reports success and changes nothing.
    #
    # This is the Render SERVICE name and it produces the hostname. Every
    # reference to that host (docs, scripts/smoke-prod.ps1, the native build's
    # VITE_API_BASE) breaks at once if it changes, so rename only as a
    # deliberate migration with the DNS cutover planned.
    name: petpro-app
    runtime: node
    plan: free
    # --include=dev: Render sets NODE_ENV=production, which would otherwise
    # skip devDependencies — and the TypeScript compiler lives there.
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
      - key: PORT
        value: 10000

  # Marketing site for the root domain (sitstayplay.pro). Separate from the app
  # service on purpose: the app's "/" is its login screen, and Stripe's business
  # URL review wants a page that says what the business does. Keeping them apart
  # means the marketing page cannot break the app, and vice versa.
  #
  # Static: no build step, no runtime, nothing to redeploy when the app changes.
  # Attach the custom domain in the Render dashboard, then point DNS at it.
  - type: web
    name: sitstayplay-landing
    runtime: static
    staticPublishPath: ./landing
    buildCommand: ""
    pullRequestPreviewsEnabled: false
