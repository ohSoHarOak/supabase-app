# Render Blueprint — creates the Sit.Stay.Play web service.
# In Render: New -> Blueprint -> connect this repo. Then add the environment
# variables listed below in the Render dashboard (never commit secrets).
services:
  - type: web
    # ⚠️ NOT renamed with the rest of the 2026-09-05 Sit.Stay.Play rename.
    # This is the Render SERVICE name, and it is what produces
    # petpro-connect.onrender.com. Changing it points the blueprint at a
    # different service: the old URL stops resolving and every reference to it
    # (docs, smoke tests, VITE_API_BASE) breaks at once. Rename only as a
    # deliberate migration with the DNS cutover planned.
    name: petpro-connect
    runtime: node
    plan: free
    # --include=dev: Render sets NODE_ENV=production, which would otherwise
    # skip devDependencies — and the TypeScript compiler lives there.
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
      - key: PORT
        value: 10000

  # Marketing site for the root domain (sitstayplay.pro). Separate from the app
  # service on purpose: the app's "/" is its login screen, and Stripe's business
  # URL review wants a page that says what the business does. Keeping them apart
  # means the marketing page cannot break the app, and vice versa.
  #
  # Static: no build step, no runtime, nothing to redeploy when the app changes.
  # Attach the custom domain in the Render dashboard, then point DNS at it.
  - type: web
    name: sitstayplay-landing
    runtime: static
    staticPublishPath: ./landing
    buildCommand: ""
    pullRequestPreviewsEnabled: false
